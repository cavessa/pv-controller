# Rotation des Prod-Cron-Logs (ohne root, per User-Cron – siehe deploy/README.md, „Log-Rotation“).
# Der Cron hängt mit >> an und öffnet die Datei bei jedem Lauf neu: Umbenennen genügt, kein copytruncate.
/home/openhabian/pvcontroller-prod/cron.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 openhabian openhab
}
