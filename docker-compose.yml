services:
  pv-controller:
    build: .
    container_name: pv-controller
    restart: unless-stopped
    network_mode: host            # muss Shelly / Wallbox / Wechselrichter im LAN erreichen
    volumes:
      - ./data:/data              # DB, Logs, temp_history persistent
      - ./config.json:/app/config.json  # Konfiguration außerhalb des Containers
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
